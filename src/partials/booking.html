<dialog class="modal" id="booking">
  <button class="icon-btn modal__close btn-reset" type="button" data-close aria-label="Закрыть">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
  <div class="form-scope">
    <div class="modal__form form-view">
      <p class="eyebrow">Запись</p>
      <h2>Бесплатная консультация</h2>
      <p class="modal__lead">Оставьте номер — администратор подберёт время и ответит на вопросы.</p>
      <form class="js-booking" id="booking-form" novalidate>
        <label class="field">
          <span>Имя</span>
          <input class="input-reset" name="name" type="text" autocomplete="name" required>
          <small class="field-error" hidden>Введите имя</small>
        </label>
        <label class="field">
          <span>Телефон</span>
          <input class="input-reset" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00" required>
          <small class="field-error" hidden>Введите телефон целиком</small>
        </label>
        <label class="field">
          <span>Интересует</span>
          <select name="service">
            <option>Консультация</option>
            <option>Брови</option>
            <option>Губы</option>
            <option>Веки</option>
            <option>Обучение</option>
            <option>Удаление старого перманента</option>
            <option>Скидка при онкозаболевании</option>
            <option>Скидка при алопеции</option>
            <option>Трихопигментация</option>
            <option>Мини-тату</option>
            <option>Ареола</option>
          </select>
        </label>
        <label class="field">
          <span>Комментарий</span>
          <textarea class="input-reset" name="comment" rows="3"></textarea>
        </label>
        <button class="btn btn-reset" type="submit">Отправить заявку
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </div>
    <div class="modal__done form-done" hidden>
      <p class="eyebrow">Готово</p>
      <h2>Заявка принята</h2>
      <p class="modal__lead form-done__text">Мы перезвоним, чтобы подтвердить время.</p>
      <button class="btn btn-reset" type="button" data-close>Хорошо</button>
    </div>
  </div>
</dialog>
