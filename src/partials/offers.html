<section class="offers" id="offers">
  <div class="container">
    <div class="offers__head">
      <p class="eyebrow">Специальные предложения</p>
      <h2>Скидка на перманент</h2>
    </div>
    <div class="offers__layout">
      <article class="offer offer--lead">
        <img src="img/work-eyes.jpg" alt="Перманент бровей и межресничная стрелка">
        <div class="offer__body">
          <p class="offer__num">50%</p>
          <h3>TRADE IN</h3>
          <p>Удаление старого перманента со скидкой 50%</p>
          <button class="btn btn-reset" type="button" data-open="booking" data-service="Удаление старого перманента">Записаться
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </article>
      <div class="offers__stack">
        <article class="offer offer--side">
          <p class="offer__num">20%</p>
          <h3>Онкозаболевания</h3>
          <p>Скидка 20% на перманент людям с онкозаболеваниями</p>
          <button class="text-link btn-reset" type="button" data-open="booking" data-service="Скидка при онкозаболевании">Записаться
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </article>
        <article class="offer offer--side">
          <p class="offer__num">50%</p>
          <h3>Алопеция</h3>
          <p>Скидка 50% на перманент бровей людям с алопецией</p>
          <button class="text-link btn-reset" type="button" data-open="booking" data-service="Скидка при алопеции">Записаться
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </article>
      </div>
    </div>
  </div>
</section>
