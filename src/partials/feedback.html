<section class="feedback" id="feedback">
  <div class="container feedback__panel form-scope">
    <div class="form-view feedback__view">
      <div class="feedback__copy">
        <p class="eyebrow">Обратный звонок</p>
        <h2>Оставьте номер — перезвоним</h2>
        <a class="feedback__phone" href="tel:+79093114454">+7 (909) 311 44 54</a>
      </div>
      <form class="js-booking feedback__form" novalidate>
        <label class="feedback__field">
          <input class="input-reset" name="name" type="text" autocomplete="name" placeholder="Имя" aria-label="Имя" required>
          <small class="field-error" hidden>Введите имя</small>
        </label>
        <label class="feedback__field">
          <input class="input-reset" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Телефон" aria-label="Телефон" required>
          <small class="field-error" hidden>Введите телефон</small>
        </label>
        <label class="feedback__field">
          <select name="city" aria-label="Город">
            <option>Казань</option>
            <option>Москва</option>
            <option>Набережные Челны</option>
            <option>Чебоксары</option>
            <option>Ульяновск</option>
          </select>
        </label>
        <input type="hidden" name="service" value="Консультация">
        <button class="btn btn-reset feedback__submit" type="submit">Жду звонка
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </div>
    <div class="form-done feedback__done" hidden>
      <h3>Заявка принята</h3>
      <p class="form-done__text">Мы перезвоним в ближайшее время.</p>
    </div>
  </div>
</section>
